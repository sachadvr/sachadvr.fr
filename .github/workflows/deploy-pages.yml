name: 📄 Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement Pages à la fois, sans annuler celui en cours (recommandation GitHub).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build
        env:
          # `/sachadvr.fr` sur l'URL projet github.io, vide (= `/`) avec un domaine personnalisé.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          # Origine des URLs SEO (canonical, hreflang, OG, sitemap). `vars.SITE_URL=https://sachadvr.fr` pour forcer le domaine.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.sachadvr.fr' }}

      # Pages n'a pas de réécriture SPA : toute URL profonde (/sachadvr.fr/en/cgu) tombe sur 404.html.
      - name: 🔁 SPA fallback
        run: cp dist/index.html dist/404.html

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
