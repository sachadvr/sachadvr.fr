services:
  website:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Le bundle tourne dans le navigateur de l'hote : l'URL doit etre joignable depuis l'hote
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: sachadvr-website
    ports:
      - "80:80"
    depends_on:
      - api-mock
    restart: unless-stopped

  website-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: sachadvr-website-dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      # Les evenements fsevents de macOS ne traversent pas le bind mount
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api-mock

  api-mock:
    image: nginx:1.27-alpine
    container_name: sachadvr-api-mock
    ports:
      - "3001:80"
    volumes:
      - ./docker/api-mock/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/api-mock/data:/srv/api-mock:ro
    restart: unless-stopped
