server {
    listen 80;
    server_name _;

    root /srv/api-mock;
    default_type application/json;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Les preflights CORS n'atteignent jamais les handlers ci-dessous
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /repos {
        try_files /repos.json =404;
    }

    location ~ "^/repos/(?<repo_name>[^/]+)/languages$" {
        try_files /languages/$repo_name.json /languages/default.json =404;
    }

    location = /mail/sender {
        return 200 '{"success":true,"message":"Mail simule par api-mock"}';
    }

    location / {
        return 404 '{"error":"Not found (api-mock)"}';
    }
}
